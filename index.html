<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon (xeda.ai brand mark) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#7C3AED" />

    <!-- Primary Meta Tags -->
    <title>xeda.ai — AI integration & automation for German-speaking businesses</title>
    <meta name="title" content="xeda.ai — AI integration & automation for German-speaking businesses" />
    <meta name="description" content="We integrate AI into your workflows and automate the repetitive work — for businesses across Germany and the DACH region. We build it and run it. Start with a free AI audit." />
    <meta name="author" content="xeda.ai" />
    <meta name="keywords" content="AI integration, AI automation, KI-Integration, KI-Automatisierung, workflow automation, custom AI, AI agency DACH, KI-Agentur, Mittelstand, GenAI studio, Germany, Austria, Switzerland" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://xeda.ai/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://xeda.ai/" />
    <meta property="og:title" content="xeda.ai — AI integration & automation for German-speaking businesses" />
    <meta property="og:description" content="We integrate AI into your workflows and automate the repetitive work, across the DACH region. We build it and run it. Start with a free AI audit." />
    <meta property="og:image" content="https://xeda.ai/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="xeda.ai" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://xeda.ai/" />
    <meta name="twitter:title" content="xeda.ai — AI integration & automation for German-speaking businesses" />
    <meta name="twitter:description" content="We integrate AI and automate the repetitive work across the DACH region. Build it, run it. Start with a free AI audit." />
    <meta name="twitter:image" content="https://xeda.ai/og-image.png" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "xeda.ai",
      "url": "https://xeda.ai",
      "logo": "https://xeda.ai/logo.png",
      "description": "Germany-based AI & automation studio that integrates AI into business workflows and automates repetitive work for companies across the DACH region — build and operate.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "DE"
      },
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "availableLanguage": ["English", "German"]
      }
    }
    </script>

    <!-- Structured Data - Service -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Service",
      "serviceType": "AI development and managed AI services",
      "provider": {
        "@type": "Organization",
        "name": "xeda.ai"
      },
      "areaServed": {
        "@type": "Place",
        "name": "Worldwide"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "AI Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI Audit"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI Build (MVP to production)"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Build & Operate (managed AI)"
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI Receptionists & Booking Systems"
            }
          }
        ]
      }
    }
    </script>

    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do we start working together?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every engagement starts with an AI Audit — a short, fixed-scope sprint that maps where AI can save you time and money, with ROI and a roadmap. You only commit to a build once you've seen the plan."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An AI Audit starts at €2,500 and a full build from €15,000. For solutions we run for you, we offer a monthly Build & Operate model. You always have a fixed scope and price before we start."
          }
        },
        {
          "@type": "Question",
          "name": "Do you just advise, or do you actually build it?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We build. We are a studio that designs, ships, and operates real software — our own products are proof of what we deliver for clients."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
