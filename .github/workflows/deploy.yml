name: Deploy to GitHub Pages

# Manual-only fallback. Production is Cloudflare Pages (xeda.ai) — see README.
# Kept so we can republish to https://xedaai.github.io/xeda-website/ if Cloudflare
# is ever unavailable; the automatic push trigger is deliberately removed so we
# don't serve two copies of the site from two hosts.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: SPA fallback so deep links (/careers, /steuerkanzleien) work on refresh
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
