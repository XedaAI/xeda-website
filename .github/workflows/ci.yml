name: CI

# Runs on every PR and on pushes to main. Typecheck + build are required gates;
# lint is surfaced but non-blocking for now (inherited template has ~20 lint errors —
# see CONTRIBUTING.md; flip `continue-on-error` off once those are cleaned up).

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint (non-blocking — see CONTRIBUTING.md)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # Edge functions live outside tsconfig.app.json, so tsc above never saw
      # them. They were shipped untypechecked until now.
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: deno check supabase/functions/*/index.ts
