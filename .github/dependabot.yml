version: 2
updates:
  # Keep npm dependencies fresh (grouped, weekly, low noise).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"

  # Keep GitHub Actions versions up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
