version: 2
updates:
  # npm dependencies.
  # Minor + patch updates are batched into ONE low-risk PR. Major updates come as
  # SEPARATE, individual PRs so a breaking major can't ride in with everything else
  # (that's what took the build/site down before). typescript majors are held back
  # because typescript-eslint pins a peer range and a TS major breaks the build.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions (grouped, weekly).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
